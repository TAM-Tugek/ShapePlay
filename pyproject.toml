[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shapeplay3d"
version = "0.1.0"
description = "Local-first ShapePlay 3D toolkit (Sprint 0 scaffold)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{ name = "ShapePlay Team" }]
dependencies = [
  "typer>=0.12",
  "torch>=2.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pre-commit>=3.7",
  "ruff>=0.5.0"
]

[project.scripts]
shapeplay = "shapeplay.cli.main:cli"

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "B", "W"]
lint.ignore = []

[tool.ruff.lint.isort]
known-first-party = ["shapeplay"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["shapeplay"]
package-dir = {"" = "src"}

