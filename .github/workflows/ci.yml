name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (dev extras)
        run: pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format . --check

      - name: Run tests
        run: pytest -q
